<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Market - Catálogo de Productos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body id="productsPage">

    <!-- NAVBAR SUPERIOR -->
    <header>
        <div class="container navbar">
            <a href="index.html" class="logo-container">
                <img src="assets/images/default_logo.png" class="logo-img" alt="Logo Colegio">
                <span class="logo-text" id="headerSchoolName">School Market</span>
            </a>

            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="products.html" class="active">Productos</a></li>
                <li><a href="teacher-products.html">Docentes</a></li>
                <li><a href="about.html">Nosotros</a></li>
            </ul>

            <div class="navbar-actions" id="navUserActions">
                <!-- Dinámico vía assets/js/main.js -->
            </div>
        </div>
    </header>

    <!-- BANNER Y FILTROS -->
    <section class="container" style="margin-top: 30px;">
        <div class="glass-panel">
            <h1 style="font-size: 28px; font-weight: 800; color: var(--text-dark); margin-bottom: 6px;">Catálogo Completo de Productos Estudiantiles</h1>
            <p style="color: var(--text-muted); font-size: 15px; margin-bottom: 20px;">Filtra por categoría, estado o palabras clave</p>

            <form id="filterForm" style="display: flex; flex-wrap: wrap; gap: 10px;">
                <input type="text" name="search" placeholder="Buscar..." style="flex: 1; min-width: 200px; height: 44px; padding: 0 16px; border-radius: var(--radius-sm); border: 1px solid var(--border-color); outline: none;">
                
                <select name="category" style="height: 44px; padding: 0 14px; border-radius: var(--radius-sm); border: 1px solid var(--border-color); outline: none; background: white;">
                    <option value="">Todas las categorías</option>
                    <option value="postres">🍰 Postres & Comida</option>
                    <option value="tutorias">📚 Tutorías & Clases</option>
                    <option value="arte">🎨 Arte & Manualidades</option>
                    <option value="tecnologia">💻 Tecnología & Código</option>
                    <option value="utiles">✏️ Útiles & Libros</option>
                </select>

                <select name="condition" style="height: 44px; padding: 0 14px; border-radius: var(--radius-sm); border: 1px solid var(--border-color); outline: none; background: white;">
                    <option value="">Cualquier estado</option>
                    <option value="new">Nuevo</option>
                    <option value="used_like_new">Usado como nuevo</option>
                    <option value="used_good">Usado en buen estado</option>
                </select>

                <input type="hidden" name="price_min" value="">
                <input type="hidden" name="price_max" value="">

                <button type="submit" class="btn btn-primary" style="height: 44px; padding: 0 20px; font-weight: 700;">
                    Filtrar
                </button>
            </form>
        </div>
    </section>

    <!-- GRILLA DE PRODUCTOS -->
    <main class="container" style="margin-bottom: 50px;">
        <div id="productGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 24px;">
            <!-- Cargas dinámicas via assets/js/products.js -->
        </div>
    </main>

    <!-- FOOTER -->
    <footer style="background: rgba(255,255,255,0.85); border-top: 1px solid var(--border-color); padding: 24px 0; text-align: center; font-size: 14px; color: var(--text-muted);">
        <div class="container">
            <p><strong>School Market</strong> • Conectando emprendedores estudiantiles.</p>
        </div>
    </footer>

    <!-- Core Scripts -->
    <script src="assets/js/main.js"></script>
    <script src="assets/js/cart.js"></script>
    <script src="assets/js/products.js"></script>
</body>
</html>
