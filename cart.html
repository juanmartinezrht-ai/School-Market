<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Market - Mi Carrito de Compras</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .cart-layout {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 24px;
            align-items: start;
        }
        @media (max-width: 900px) {
            .cart-layout {
                grid-template-columns: 1fr;
            }
        }
        .cart-table {
            width: 100%;
            border-collapse: collapse;
        }
        .cart-table th {
            text-align: left;
            padding: 12px 14px;
            font-size: 13px;
            color: var(--text-muted);
            border-bottom: 2px solid var(--border-color);
            text-transform: uppercase;
        }
        .cart-table td {
            padding: 16px 14px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }
        .cart-item-img {
            width: 70px;
            height: 70px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid var(--border-color);
        }
        .cart-summary-card {
            background: white;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            padding: 24px;
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 90px;
        }
        .qty-control {
            display: inline-flex;
            align-items: center;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            overflow: hidden;
            background: white;
        }
        .qty-btn {
            width: 32px;
            height: 32px;
            background: #f8fafc;
            border: none;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .qty-btn:hover {
            background: #e2e8f0;
        }
        .qty-val {
            width: 40px;
            height: 32px;
            border: none;
            text-align: center;
            font-weight: 700;
            font-size: 14px;
            outline: none;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.open {
            display: flex;
        }
        .modal-content {
            background: white;
            border-radius: var(--radius-md);
            max-width: 520px;
            width: 90%;
            padding: 30px;
            box-shadow: var(--shadow-lg);
        }
    </style>
</head>
<body>

    <!-- NAVBAR SUPERIOR -->
    <header>
        <div class="container navbar">
            <a href="index.html" class="logo-container">
                <img src="assets/images/default_logo.png" class="logo-img" alt="Logo Colegio">
                <span class="logo-text" id="headerSchoolName">School Market</span>
            </a>

            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="products.html">Productos</a></li>
                <li><a href="teacher-products.html">Docentes</a></li>
                <li><a href="about.html">Nosotros</a></li>
            </ul>

            <div class="navbar-actions" id="navUserActions">
                <!-- Dinámico vía assets/js/main.js -->
            </div>
        </div>
    </header>

    <main class="container" style="margin-top: 30px; margin-bottom: 60px;">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px;">
            <div>
                <h1 style="font-size: 28px; font-weight: 800; color: var(--text-dark); display: flex; align-items: center; gap: 10px;">
                    <i class="fa-solid fa-cart-shopping" style="color: var(--primary-color);"></i> Mi Carrito de Compras
                </h1>
                <p style="color: var(--text-muted); font-size: 14px; margin-top: 4px;">Revisa tus artículos antes de confirmar la compra escolar</p>
            </div>
            <button id="btnClearCart" onclick="handleClearCart()" class="btn btn-outline" style="border-radius: 50px; font-size: 13px; font-weight: 600; display: none;">
                <i class="fa-regular fa-trash-can"></i> Vaciar Carrito
            </button>
        </div>

        <!-- Layout Carrito -->
        <div id="cartContainer">
            <!-- Renderizado dinámicamente vía JS -->
        </div>
    </main>

    <!-- MODAL DE RECIBO FINAL DE COMPRA -->
    <div id="orderReceiptModal" class="modal">
        <div class="modal-content" style="text-align: center;">
            <div style="font-size: 52px; color: #10b981; margin-bottom: 12px;">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h3 style="font-size: 22px; font-weight: 800; margin-bottom: 6px;">¡Compra Realizada con Éxito!</h3>
            <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 20px;">Tu orden ha sido registrada en el sistema escolar.</p>

            <div id="receiptItemsBox" style="background: #f8fafc; padding: 16px; border-radius: 8px; text-align: left; font-size: 13px; margin-bottom: 20px; max-height: 220px; overflow-y: auto;">
                <!-- Recibos por ítem -->
            </div>

            <div style="display: flex; justify-content: space-between; font-size: 16px; font-weight: 800; padding: 10px 0; border-top: 2px solid #e2e8f0; margin-bottom: 20px;">
                <span>Total Pagado:</span>
                <span id="receiptTotalAmount" style="color: var(--primary-color);">$0 COP</span>
            </div>

            <button class="btn btn-primary" onclick="closeReceiptModalAndGo()" style="width: 100%; height: 46px; border-radius: 50px; font-weight: 700;">
                Entendido / Volver al Catálogo <i class="fa-solid fa-arrow-right" style="margin-left: 6px;"></i>
            </button>
        </div>
    </div>

    <!-- Core Scripts -->
    <script src="assets/js/main.js"></script>
    <script src="assets/js/cart.js"></script>
    <script>
        const cop = new Intl.NumberFormat('es-CO', {
            style: 'currency',
            currency: 'COP',
            maximumFractionDigits: 0
        });

        document.addEventListener('DOMContentLoaded', () => {
            renderCartPage();
        });

        function renderCartPage() {
            const container = document.getElementById('cartContainer');
            const btnClear = document.getElementById('btnClearCart');
            const items = (window.Cart && typeof window.Cart.getItems === 'function') 
                ? window.Cart.getItems() 
                : (typeof Cart !== 'undefined' ? Cart.getItems() : []);

            if (items.length === 0) {
                btnClear.style.display = 'none';
                container.innerHTML = `
                    <div class="glass-panel" style="text-align: center; padding: 60px 20px;">
                        <div style="font-size: 64px; color: #94a3b8; margin-bottom: 16px;">
                            <i class="fa-solid fa-cart-shopping"></i>
                        </div>
                        <h2 style="font-size: 24px; font-weight: 800; color: var(--text-dark); margin-bottom: 8px;">Tu carrito está vacío</h2>
                        <p style="color: var(--text-muted); font-size: 15px; max-width: 460px; margin: 0 auto 24px;">
                            Aún no has agregado productos a tu carrito. Explora las opciones disponibles en tu colegio y apoya los proyectos escolares.
                        </p>
                        <a href="products.html" class="btn btn-primary" style="display: inline-flex; align-items: center; gap: 8px; border-radius: 50px; padding: 12px 28px; font-weight: 700; text-decoration: none;">
                            <i class="fa-solid fa-magnifying-glass"></i> Ver Productos Disponibles
                        </a>
                    </div>
                `;
                return;
            }

            btnClear.style.display = 'inline-flex';

            let itemsHtml = '';
            let subtotal = 0;

            items.forEach(item => {
                const itemTotal = item.price * item.quantity;
                subtotal += itemTotal;

                itemsHtml += `
                    <tr>
                        <td style="width: 80px;">
                            <img src="${item.image}" class="cart-item-img" alt="${sanitizeHTML(item.title)}">
                        </td>
                        <td>
                            <div style="font-weight: 800; font-size: 15px; color: var(--text-dark); margin-bottom: 4px;">
                                <a href="product-details.html?type=${item.type}&id=${item.id}" style="color:inherit; text-decoration:none;">
                                    ${sanitizeHTML(item.title)}
                                </a>
                            </div>
                            <div style="font-size: 12px; color: var(--text-muted);">
                                Vendedor: <span style="font-weight: 600; color: var(--text-dark);">${sanitizeHTML(item.seller_name)}</span>
                            </div>
                            <div style="font-size: 11px; color: #166534; background: #dcfce7; display: inline-block; padding: 2px 8px; border-radius: 12px; margin-top: 4px; font-weight: 700;">
                                Stock disponible: ${item.stock}
                            </div>
                        </td>
                        <td style="font-weight: 700; color: var(--text-dark); font-size: 14px;">
                            ${cop.format(item.price)}
                        </td>
                        <td>
                            <div class="qty-control">
                                <button class="qty-btn" onclick="changeQty(${item.id}, '${item.type}', ${item.quantity - 1})">-</button>
                                <input class="qty-val" type="text" value="${item.quantity}" readonly>
                                <button class="qty-btn" onclick="changeQty(${item.id}, '${item.type}', ${item.quantity + 1})">+</button>
                            </div>
                        </td>
                        <td style="font-weight: 800; color: var(--primary-color); font-size: 15px;">
                            ${cop.format(itemTotal)}
                        </td>
                        <td style="text-align: right;">
                            <button onclick="removeCartItem(${item.id}, '${item.type}')" title="Eliminar" style="background: none; border: none; color: #ef4444; font-size: 16px; cursor: pointer; padding: 6px;">
                                <i class="fa-regular fa-trash-can"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });

            const commissionRate = 0.05; // 5%
            const commission = subtotal * commissionRate;
            const total = subtotal;

            container.innerHTML = `
                <div class="cart-layout">
                    <!-- Tabla de Productos -->
                    <div class="glass-panel" style="padding: 20px; overflow-x: auto;">
                        <table class="cart-table">
                            <thead>
                                <tr>
                                    <th></th>
                                    <th>Producto</th>
                                    <th>Precio</th>
                                    <th>Cantidad</th>
                                    <th>Subtotal</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>
                                ${itemsHtml}
                            </tbody>
                        </table>
                    </div>

                    <!-- Resumen del Pedido -->
                    <div class="cart-summary-card">
                        <h3 style="font-size: 18px; font-weight: 800; margin-bottom: 16px; color: var(--text-dark);">
                            <i class="fa-solid fa-receipt" style="color: var(--primary-color);"></i> Resumen de Compra
                        </h3>

                        <div style="display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; color: var(--text-muted);">
                            <span>Subtotal:</span>
                            <span style="font-weight: 700; color: var(--text-dark);">${cop.format(subtotal)}</span>
                        </div>

                        <div style="display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 13px; color: var(--text-muted);">
                            <span>Soporte Escolar (5% inc.):</span>
                            <span>${cop.format(commission)}</span>
                        </div>

                        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 16px 0;">

                        <div style="display: flex; justify-content: space-between; margin-bottom: 24px; font-size: 18px; font-weight: 800; color: var(--text-dark);">
                            <span>Total a Pagar:</span>
                            <span style="color: var(--primary-color);">${cop.format(total)}</span>
                        </div>

                        <button id="btnProceedCheckout" onclick="processCartCheckout()" class="btn btn-primary" style="width: 100%; height: 48px; border-radius: 50px; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px;">
                            <i class="fa-solid fa-shield-check"></i> Finalizar Compra
                        </button>

                        <div style="margin-top: 16px; text-align: center; font-size: 12px; color: var(--text-muted);">
                            <i class="fa-solid fa-lock" style="color: #10b981;"></i> Compra protegida dentro de tu comunidad educativa
                        </div>
                    </div>
                </div>
            `;
        }

        function changeQty(id, type, newQty) {
            Cart.updateQuantity(id, type, newQty);
            renderCartPage();
        }

        function removeCartItem(id, type) {
            Cart.removeItem(id, type);
            renderCartPage();
        }

        function handleClearCart() {
            if (confirm('¿Estás seguro de que deseas vaciar tu carrito de compras?')) {
                Cart.clear();
                renderCartPage();
            }
        }

        /**
         * Realizar compra de todos los artículos del carrito
         */
        async function processCartCheckout() {
            // Verificar si el usuario ha iniciado sesión
            if (!currentUser) {
                showToast('Debes iniciar sesión para realizar compras.', 'error');
                setTimeout(() => { window.location.href = 'login.html'; }, 1500);
                return;
            }

            const items = Cart.getItems();
            if (items.length === 0) return;

            const checkoutBtn = document.getElementById('btnProceedCheckout');
            checkoutBtn.disabled = true;
            checkoutBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Procesando pedidos...';

            const successfulReceipts = [];
            const errors = [];

            for (const item of items) {
                const endpoint = item.type === 'teacher' ? API_TEACHER : API_PRODUCT;
                const body = new FormData();
                body.append('product_id', item.id);
                body.append('quantity', item.quantity);

                try {
                    const response = await fetch(`${endpoint}?action=buy`, {
                        method: 'POST',
                        body: body
                    });
                    const res = await response.json();

                    if (res.status === 'success') {
                        successfulReceipts.push(res.data);
                    } else {
                        errors.push(`"${item.title}": ${res.message}`);
                    }
                } catch (e) {
                    errors.push(`"${item.title}": Falló la conexión`);
                }
            }

            checkoutBtn.disabled = false;
            checkoutBtn.innerHTML = '<i class="fa-solid fa-shield-check"></i> Finalizar Compra';

            if (successfulReceipts.length > 0) {
                // Limpiar carrito
                Cart.clear();
                renderCartPage();

                // Mostrar modal con recibo
                showOrderReceiptModal(successfulReceipts, errors);
            } else {
                showToast('No se pudo completar la compra: ' + errors.join(', '), 'error');
            }
        }

        function showOrderReceiptModal(receipts, errors) {
            const modal = document.getElementById('orderReceiptModal');
            const itemsBox = document.getElementById('receiptItemsBox');
            const totalEl = document.getElementById('receiptTotalAmount');

            let totalPaid = 0;
            let html = '';

            receipts.forEach(r => {
                totalPaid += parseFloat(r.price);
                html += `
                    <div style="border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; margin-bottom: 8px;">
                        <div style="display:flex; justify-content:space-between; font-weight:700;">
                            <span>${sanitizeHTML(r.product_title)} (x${r.quantity})</span>
                            <span style="color:var(--primary-color);">${cop.format(r.price)}</span>
                        </div>
                        <div style="font-size:12px; color:var(--text-muted);">
                            Vendedor: ${sanitizeHTML(r.seller_name)} | Orden #${r.transaction_id}
                        </div>
                    </div>
                `;
            });

            if (errors.length > 0) {
                html += `
                    <div style="color:#ef4444; font-size:12px; margin-top:8px;">
                        <strong>Nota:</strong> Algunos productos no se pudieron procesar: ${errors.join('; ')}
                    </div>
                `;
            }

            itemsBox.innerHTML = html;
            totalEl.innerText = cop.format(totalPaid);
            modal.classList.add('open');
        }

        function closeReceiptModalAndGo() {
            const modal = document.getElementById('orderReceiptModal');
            modal.classList.remove('open');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
